  <script>
    const THEMES = {
      "Default":       { bg: "#fffbef", fg: "#222222" },
      "Castle":        { bg: "#171628", fg: "#ffffff" },
      "ProveIt":       { bg: "#223c5f", fg: "#ff3300" },
      "HakunaMatata":  { bg: "#0c2c73", fg: "#ffffff" },
      "Drawer":        { bg: "#1d2643", fg: "#02d3be" },
      "tooSigma":      { bg: "#00a5bd", fg: "#edf9fa" },
      "PokerRiver":    { bg: "#0e4888", fg: "#e7f2f8" },
      "PlainJane":     { bg: "#ffffff", fg: "#000000" },
      "insiderTrader27": { bg: "#000000", fg: "#00aeef" },
      "HormoneReplacementTherapy": { bg: "#fc8404", fg: "#ffffff" },
      "Musashi":       { bg: "#405270", fg: "#ffffff" },
      "Root":          { bg: "#000000", fg: "#66b361" }
    };

    const THEME_ORDER = [
      "Default", "Castle", "ProveIt", "HakunaMatata", "Drawer",
      "tooSigma", "PokerRiver", "PlainJane", "insiderTrader27",
      "HormoneReplacementTherapy", "Musashi", "Root"
    ];

    let themeIndex = 0;

    function applyTheme(name) {
      const t = THEMES[name] || THEMES["Default"];
      document.documentElement.style.setProperty("--bg", t.bg);
      document.documentElement.style.setProperty("--fg", t.fg);
      document.documentElement.style.setProperty("--border", t.fg);
      document.body.style.background = t.bg;
      document.body.style.color = t.fg;
    }

    document.getElementById("repaintBtn").addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % THEME_ORDER.length;
      applyTheme(THEME_ORDER[themeIndex]);
    });

    applyTheme(THEME_ORDER[themeIndex]);

    const PAIRS = [
      { left: "against aesthetics", right: "results" },
      { left: "against generality", right: "precision" },
      { left: "against drift", right: "direction" },
      { left: "against noise", right: "signal" },
      { left: "against geometry", right: "topology" },
      { left: "against frequentists", right: "bayesians" },
      { left: "against inefficiency", right: "liquidity" },
      { left: "against pretense", right: "honesty" },
      { left: "against experience", right: "understanding" },
      { left: "against overfitting", right: "robustness" },
      { left: "against fuels", right: "fossils" },
      { left: "against Stravinsky", right: "Scriabin" },
      { left: "against fuels", right: "fossils" },
      { left: "against closed-form solutions", right: "simulations" },
      { left: "against chaos", right: "stochasticity" }

    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789<>/=+*#%&?";

    function scrambleToText(el, target, duration = 900) {
      const start = performance.now();
      const maxLen = Math.max(target.length, el.textContent.length);

      function frame(now) {
        const progress = Math.min((now - start) / duration, 1);
        const reveal = Math.floor(progress * target.length);

        let out = "";
        for (let i = 0; i < maxLen; i++) {
          if (i < reveal && i < target.length) {
            out += target[i];
          } else if (i < target.length) {
            out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          }
        }

        el.textContent = out;

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          el.textContent = target;
        }
      }

      requestAnimationFrame(frame);
    }

    const rows = [...document.querySelectorAll(".principle")].map(row => ({
      left: row.querySelector(".slot.left"),
      right: row.querySelector(".slot.right")
    }));

    function fillRows(initial = false) {
      const selected = shuffle(PAIRS).slice(0, rows.length);

      rows.forEach((row, i) => {
        const pair = selected[i];
        if (initial) {
          row.left.textContent = pair.left;
          row.right.textContent = pair.right;
        } else {
          scrambleToText(row.left, pair.left, 700 + Math.random() * 500);
          setTimeout(() => {
            scrambleToText(row.right, pair.right, 700 + Math.random() * 500);
          }, 120 + Math.random() * 250);
        }
      });
    }

    fillRows(true);
    setInterval(() => fillRows(false), 3600);
  </script>
